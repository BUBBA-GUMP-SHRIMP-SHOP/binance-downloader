services:
  kline-web-provider:
    image: kline-web-provider:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
    user: "1000:1000"
    ports:
      - "9001:8000"
    environment:
      ROCKET_ADDRESS: 0.0.0.0
      ROCKET_PORT: "8000"
    volumes:
      - /home/jbc/.local/share/binance-archive:/app/data
    restart: always
