[package]
name = "binance-downloader"
version = "1.1.0"
edition = "2024"

[lib]
name = "binance_downloader"
path = "src/lib.rs"

[[bin]]
name = "binance-downloader"
path = "src/main.rs"

[dependencies]
archive = { path = "../archive" }
anyhow = "1.0.102"
clap = { version = "4.6.0", features = ["derive"] }
reqwest = "0.13.2"
tokio = { version = "1.51.1", features = ["rt", "macros", "rt-multi-thread", "parking_lot", "fs", "io-std", "io-util", "sync"] }
url = "2.5.8"
